<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Загрузка... — Масса Матере</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --oz-blue:#005BFF;--oz-blue-light:#E5EEFF;--oz-blue-dark:#0040CC;
  --oz-orange:#F46D00;--oz-green:#00A650;--oz-red:#F11010;
  --oz-bg:#F3F4F6;--oz-card:#FFF;--oz-border:#E0E0E0;
  --oz-text:#1A1A1A;--oz-text2:#666;--oz-text3:#999;
  --oz-star:#FFB800;--wb-purple:#CB11AB;
  --radius:8px
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--oz-bg);color:var(--oz-text);font-size:14px;line-height:1.5}

.topbar{background:var(--oz-blue);padding:10px 0}
.topbar-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:16px}
.logo{color:#fff;font-size:20px;font-weight:700;letter-spacing:-.5px;text-decoration:none}
.logo span{opacity:.7;font-size:13px;font-weight:400;margin-left:6px}
.topbar-icons{display:flex;gap:20px;color:#fff;font-size:12px;align-items:center}
.topbar-icon{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#fff;opacity:.9}
.topbar-icon .ico{font-size:18px}

.bread{max-width:1200px;margin:0 auto;padding:10px 20px;font-size:12px;color:var(--oz-text2);display:flex;gap:4px;flex-wrap:wrap}
.bread a{color:var(--oz-text2);text-decoration:none}.bread a:hover{color:var(--oz-blue)}

.page{max-width:1200px;margin:0 auto;padding:0 20px 40px}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start;margin-top:16px}
@media(max-width:768px){.product-layout{grid-template-columns:1fr}}

/* Gallery */
.gallery{position:relative}
.gallery-main{width:100%;aspect-ratio:1;background:var(--oz-card);border-radius:var(--radius);border:1px solid var(--oz-border);overflow:hidden;position:relative}
.gallery-main img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-thumbs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.thumb{width:64px;height:64px;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;flex-shrink:0}
.thumb.active{border-color:var(--oz-blue)}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge-disc{position:absolute;top:12px;left:12px;background:var(--oz-red);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:4px;z-index:2}
.badge-wb{position:absolute;bottom:0;left:0;right:0;background:var(--wb-purple);color:#fff;font-size:11px;font-weight:500;padding:6px 12px;text-align:center;z-index:2}

/* Info */
.product-info{display:flex;flex-direction:column;gap:16px}
.product-title{font-size:20px;font-weight:700;line-height:1.3}
.rating-row{display:flex;align-items:center;gap:8px;font-size:13px}
.rating-stars{color:var(--oz-star)}
.rating-cnt{color:var(--oz-text3)}
.price-block{display:flex;align-items:baseline;gap:10px}
.price-now{font-size:28px;font-weight:800}
.price-old{font-size:16px;color:var(--oz-text3);text-decoration:line-through}
.price-disc{font-size:14px;font-weight:600;color:var(--oz-red)}
.cashback{font-size:12px;color:var(--oz-blue);margin-top:-8px}

/* Buttons */
.btn-row{display:flex;gap:10px}
.btn-cart-big{flex:1;padding:14px;background:var(--oz-blue);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-cart-big:hover{background:var(--oz-blue-dark)}
.btn-buy{padding:14px 24px;background:var(--oz-orange);color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}

/* Chars table */
.chars{background:var(--oz-card);border-radius:var(--radius);border:1px solid var(--oz-border);padding:20px;margin-top:8px}
.chars h3{font-size:16px;margin-bottom:12px}
.char-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--oz-border);font-size:13px}
.char-row:last-child{border:none}
.char-key{color:var(--oz-text2)}
.char-val{font-weight:500;text-align:right;max-width:60%}

/* Features */
.features{background:var(--oz-card);border-radius:var(--radius);border:1px solid var(--oz-border);padding:20px;margin-top:8px}
.features h3{font-size:16px;margin-bottom:12px}
.feat-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--oz-border);font-size:13px}
.feat-item:last-child{border:none}
.feat-icon{font-size:20px;flex-shrink:0;width:28px;text-align:center}

/* Reviews */
.reviews-section{background:var(--oz-card);border-radius:var(--radius);border:1px solid var(--oz-border);padding:20px;margin-top:8px}
.reviews-section h3{font-size:16px;margin-bottom:12px}
.rv-summary{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rv-big{font-size:40px;font-weight:800}
.rv-stars-big{color:var(--oz-star);font-size:16px}
.rv-count{font-size:12px;color:var(--oz-text3)}
.review{padding:14px 0;border-bottom:1px solid var(--oz-border)}
.review:last-child{border:none}
.rv-hdr{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rv-ava{width:32px;height:32px;border-radius:50%;background:var(--oz-blue-light);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--oz-blue);flex-shrink:0}
.rv-name{font-weight:600;font-size:13px}
.rv-date{font-size:11px;color:var(--oz-text3)}
.rv-s{color:var(--oz-star);font-size:12px;margin-bottom:4px}
.rv-t{font-size:13px;line-height:1.5;color:#444}
.rv-badge{font-size:11px;color:var(--oz-green);margin-top:6px;display:inline-block}

/* About */
.about{background:var(--oz-card);border-radius:var(--radius);border:1px solid var(--oz-border);padding:20px;margin-top:8px}
.about h3{font-size:16px;margin-bottom:8px}
.about p{font-size:13px;line-height:1.6;color:#444;margin-bottom:8px}

/* Loading */
.loading{text-align:center;padding:80px 20px;color:var(--oz-text3);font-size:16px}
.loading::before{content:'⏳';display:block;font-size:40px;margin-bottom:12px;animation:spin 1.5s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.error{text-align:center;padding:80px 20px;color:var(--oz-red);font-size:16px}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="logo" href="/">Масса Матере <span>Пекарня</span></a>
    <div style="flex:1"></div>
    <div class="topbar-icons">
      <a class="topbar-icon" href="/" ><span class="ico">📋</span>Каталог</a>
      <a class="topbar-icon" href="https://t.me/Sourdough_Bakery_Bot" target="_blank"><span class="ico">📱</span>Telegram</a>
    </div>
  </div>
</div>

<div class="bread">
  <a href="/">Каталог</a><span style="color:var(--oz-border);margin:0 4px">›</span>
  <span id="breadName">Загрузка...</span>
</div>

<div class="page">
  <div id="content">
    <div class="loading">Загружаю карточку товара…</div>
  </div>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbygMB0RJZg8tHOm1ueGdNob4ihBssXRwAK4MGwBW3Z4IT5X4qA0Guo1tqcRkWnqoBjj/exec';
const productId = new URLSearchParams(location.search).get('id');

function stars(n) {
  const k = Math.min(5, Math.max(0, Math.round(Number(n) || 0)));
  return '★'.repeat(k) + '☆'.repeat(5 - k);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function renderProduct(p) {
  document.title = p.name + ' — Масса Матере';
  document.getElementById('breadName').textContent = p.name;

  const discount = p.oldPrice ? Math.round((1 - p.price / p.oldPrice) * 100) : 0;
  const cashback = Math.round(p.price * 0.1);

  // Gallery
  const photos = p.photos && p.photos.length ? p.photos : [p.photo];
  const thumbsHtml = photos.map((url, i) =>
    `<div class="thumb ${i===0?'active':''}" onclick="switchPhoto(this,${i})"><img src="${esc(url)}" alt="Фото ${i+1}"/></div>`
  ).join('');

  // Chars
  const charRows = [
    ['Вес', p.weight + ' г'],
    ['Состав', p.composition],
    ['Ферментация', p.fermentation],
    ['Срок годности', p.shelfLife],
    ['КБЖУ', p.calories],
    ['Аллергены', p.allergens],
  ].filter(([,v]) => v).map(([k,v]) =>
    `<div class="char-row"><span class="char-key">${esc(k)}</span><span class="char-val">${esc(v)}</span></div>`
  ).join('');

  // Features
  const featIcons = ['🌾','🔥','✋','⏳','🧀','🌿','🫗'];
  const featsHtml = (p.features || []).map((f, i) =>
    `<div class="feat-item"><span class="feat-icon">${featIcons[i % featIcons.length]}</span><span>${esc(f)}</span></div>`
  ).join('');

  document.getElementById('content').innerHTML = `
    <div class="product-layout">
      <div class="gallery">
        <div class="gallery-main" id="mainFrame">
          ${discount ? `<span class="badge-disc">−${discount}%</span>` : ''}
          <img id="mainPhoto" src="${esc(photos[0])}" alt="${esc(p.name)}"/>
          <div class="badge-wb">${esc(p.badge)} · ${p.reviews} отзывов · ${p.rating}★</div>
        </div>
        <div class="gallery-thumbs">${thumbsHtml}</div>
      </div>

      <div class="product-info">
        <div class="product-title">${esc(p.name)}, ${p.weight} г</div>
        <div class="rating-row">
          <span class="rating-stars">${stars(p.rating)}</span>
          <span class="rating-cnt">${p.reviews} отзывов</span>
        </div>
        <div class="price-block">
          <span class="price-now">${p.price} ₽</span>
          ${p.oldPrice ? `<span class="price-old">${p.oldPrice} ₽</span>` : ''}
          ${discount ? `<span class="price-disc">−${discount}%</span>` : ''}
        </div>
        <div class="cashback">⟵ Вернём ${cashback} ₽ баллами</div>
        <div class="btn-row">
          <button class="btn-cart-big" onclick="addCart(this)">🛒 В корзину</button>
          <a class="btn-buy" href="sourdough-shop.html" target="_blank">Купить сейчас</a>
        </div>
        <div style="font-size:12px;color:var(--oz-green);margin-top:-4px">✓ В наличии · Выпечка вт/чт/сб</div>
      </div>
    </div>

    <div class="about">
      <h3>О товаре</h3>
      <p>${esc(p.desc)}</p>
    </div>

    ${charRows ? `<div class="chars"><h3>Характеристики</h3>${charRows}</div>` : ''}
    ${featsHtml ? `<div class="features"><h3>Особенности</h3>${featsHtml}</div>` : ''}

    <div class="reviews-section">
      <h3>Отзывы покупателей</h3>
      <div class="rv-summary">
        <div><div class="rv-big">${p.rating}</div><div class="rv-stars-big">${stars(p.rating)}</div></div>
        <div class="rv-count">${p.reviews} отзывов</div>
      </div>
      <div id="reviewsList"><div style="color:var(--oz-text3);font-size:13px">Загружаю отзывы…</div></div>
    </div>
  `;

  loadReviews(p.id);
}

// Gallery photo switching
function switchPhoto(el, idx) {
  document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const photos = document.querySelectorAll('.thumb img');
  if (photos[idx]) document.getElementById('mainPhoto').src = photos[idx].src;
}

// Cart button
function addCart(btn) {
  btn.textContent = '✓ В корзине';
  btn.style.background = 'var(--oz-green)';
  setTimeout(() => { btn.textContent = '🛒 В корзину'; btn.style.background = ''; }, 2000);
}

// Load reviews from Sheets
async function loadReviews(sku) {
  const el = document.getElementById('reviewsList');
  if (!API || API === ('__REVIEWS_API'+'_URL__')) { el.innerHTML = ''; return; }
  try {
    const r = await fetch(API + '?action=reviews&sku=' + sku + '&limit=5');
    const reviews = await r.json();
    if (!Array.isArray(reviews) || !reviews.length) { el.innerHTML = '<div style="color:var(--oz-text3);font-size:13px">Пока нет отзывов</div>'; return; }
    el.innerHTML = reviews.map(r => `
      <div class="review">
        <div class="rv-hdr"><div class="rv-ava">${(r.name||'П').charAt(0)}</div><div><div class="rv-name">${esc(r.name)}</div><div class="rv-date">${esc(r.date)}</div></div></div>
        <div class="rv-s">${stars(r.score)}</div>
        ${r.text ? `<div class="rv-t">${esc(r.text)}</div>` : ''}
        <span class="rv-badge">✓ Проверенная покупка</span>
      </div>
    `).join('');
  } catch(e) { el.innerHTML = ''; }
}

// Load product
async function init() {
  if (!productId) {
    document.getElementById('content').innerHTML = '<div class="error">Товар не указан. <a href="/">Вернуться в каталог</a></div>';
    return;
  }
  if (!API || !API.startsWith('http')) {
    document.getElementById('content').innerHTML = '<div class="error">API не подключен</div>';
    return;
  }
  try {
    const r = await fetch(API + '?action=products&id=' + encodeURIComponent(productId));
    const data = await r.json();
    // API может вернуть объект (один товар) или массив (все товары) — обрабатываем оба случая
    let p = null;
    if (Array.isArray(data)) {
      p = data.find(x => String(x.id).trim() === String(productId).trim()) || null;
    } else if (data && data.id) {
      p = data;
    }
    if (p && p.id) {
      renderProduct(p);
      loadReviews(p.id);
    } else {
      document.getElementById('content').innerHTML = '<div class="error">Товар «' + esc(productId) + '» не найден. <a href="/">Вернуться в каталог</a></div>';
    }
  } catch(e) {
    document.getElementById('content').innerHTML = '<div class="error">Ошибка загрузки: ' + esc(e.message) + '</div>';
  }
}
init();
</script>
</body>
</html>
