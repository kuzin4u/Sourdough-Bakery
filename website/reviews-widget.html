<!--
  Виджет отзывов — Масса Матере
  ==============================
  Загружает отзывы из Google Sheets через Apps Script (GET).
  Встраивается в карточки товаров, лендинг или любую страницу.

  Подключение:
    1. Развернуть reviews-apps-script.gs как Web App
    2. Вставить URL в REVIEWS_API ниже
    3. Скопировать <link>, <style>, HTML-блок и <script> на страницу
    — или подключить <script src="reviews-widget.js"> (если вынести JS)

  Параметры:
    data-sku="tartin"   — фильтр по SKU (опционально)
    data-limit="10"     — макс. кол-во отзывов
    data-api="https://..." — URL Apps Script (если не задан глобально)
-->

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Отзывы — Масса Матере</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* ═══ Встраиваемые стили виджета отзывов ═══ */
:root {
  --rv-bg: #FBF6EC;
  --rv-card: #FFF;
  --rv-border: #E8E2D4;
  --rv-text: #1a1a1a;
  --rv-muted: #7a7268;
  --rv-star: #D4A843;
  --rv-star-empty: #E0DDD8;
  --rv-green: #2aa05c;
  --rv-blue: #3b82f6;
  --rv-radius: 12px;
  --rv-crust: #3E2A1E;
  --rv-cream: #F6EEE0;
  --rv-gold: #C8932B;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body.rv-standalone {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--rv-bg);
  padding: 24px;
  color: var(--rv-text);
}

.reviews-widget {
  font-family: 'Inter', system-ui, sans-serif;
  max-width: 720px;
  margin: 0 auto;
}

/* ─── Summary bar ─── */
.rv-summary {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 24px;
  background: var(--rv-card);
  border: 1px solid var(--rv-border);
  border-radius: var(--rv-radius);
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.rv-big-score {
  text-align: center;
  min-width: 80px;
}

.rv-big-num {
  font-size: 48px;
  font-weight: 800;
  line-height: 1;
  color: var(--rv-text);
}

.rv-big-stars {
  color: var(--rv-star);
  font-size: 16px;
  margin-top: 6px;
}

.rv-big-count {
  font-size: 12px;
  color: var(--rv-muted);
  margin-top: 2px;
}

.rv-bars {
  flex: 1;
  min-width: 160px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.rv-bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--rv-muted);
}

.rv-bar-label { width: 24px; text-align: right; }

.rv-bar {
  flex: 1;
  height: 6px;
  background: var(--rv-star-empty);
  border-radius: 3px;
  overflow: hidden;
}

.rv-bar-fill {
  height: 100%;
  background: var(--rv-star);
  border-radius: 3px;
  transition: width 0.6s ease;
}

.rv-bar-cnt { width: 20px; }

/* ─── Filter tabs ─── */
.rv-filters {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

.rv-filter-btn {
  padding: 6px 14px;
  border: 1px solid var(--rv-border);
  border-radius: 20px;
  background: var(--rv-card);
  color: var(--rv-muted);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
}

.rv-filter-btn:hover {
  border-color: var(--rv-gold);
  color: var(--rv-text);
}

.rv-filter-btn.active {
  background: var(--rv-crust);
  color: var(--rv-cream);
  border-color: var(--rv-crust);
}

/* ─── Review cards ─── */
.rv-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rv-card {
  background: var(--rv-card);
  border: 1px solid var(--rv-border);
  border-radius: var(--rv-radius);
  padding: 20px;
  transition: box-shadow 0.15s;
}

.rv-card:hover {
  box-shadow: 0 4px 16px rgba(62,42,30,0.06);
}

.rv-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.rv-avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--rv-cream), #EFE2C8);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  color: var(--rv-crust);
  flex-shrink: 0;
}

.rv-meta {
  flex: 1;
}

.rv-name {
  font-weight: 600;
  font-size: 14px;
}

.rv-date {
  font-size: 12px;
  color: var(--rv-muted);
  margin-top: 1px;
}

.rv-stars {
  color: var(--rv-star);
  font-size: 13px;
  letter-spacing: 1px;
}

.rv-text {
  font-size: 14px;
  line-height: 1.65;
  color: #444;
}

.rv-sku-tag {
  display: inline-block;
  margin-top: 10px;
  padding: 2px 10px;
  background: var(--rv-cream);
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  color: var(--rv-crust);
}

.rv-badge {
  display: inline-block;
  margin-top: 8px;
  margin-left: 8px;
  padding: 2px 8px;
  background: rgba(42,160,92,0.1);
  border-radius: 4px;
  font-size: 11px;
  color: var(--rv-green);
  font-weight: 500;
}

/* ─── Loading / Empty ─── */
.rv-loading, .rv-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--rv-muted);
  font-size: 14px;
}

.rv-loading::before {
  content: '⏳';
  display: block;
  font-size: 28px;
  margin-bottom: 8px;
  animation: rv-spin 1.5s linear infinite;
}

@keyframes rv-spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.rv-empty::before {
  content: '💬';
  display: block;
  font-size: 28px;
  margin-bottom: 8px;
}

/* ─── Write review CTA ─── */
.rv-write-cta {
  display: block;
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  background: var(--rv-crust);
  color: var(--rv-cream);
  border: none;
  border-radius: var(--rv-radius);
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  transition: all 0.15s;
}

.rv-write-cta:hover {
  background: #4A2E1C;
  box-shadow: 0 4px 16px rgba(62,42,30,0.2);
}

/* ─── Adaptive ─── */
@media (max-width: 480px) {
  .rv-summary { gap: 16px; padding: 16px; }
  .rv-big-num { font-size: 36px; }
  .rv-card { padding: 16px; }
}
</style>
</head>
<body class="rv-standalone">

<!-- ═══════════════════════════════════════════════════════════
     Встраиваемый блок: скопировать на страницу
     ═══════════════════════════════════════════════════════════ -->
<div class="reviews-widget" id="reviewsWidget"
     data-api="__REVIEWS_API_URL__"
     data-limit="20">

  <!-- Summary -->
  <div class="rv-summary" id="rvSummary" style="display:none">
    <div class="rv-big-score">
      <div class="rv-big-num" id="rvAvg">—</div>
      <div class="rv-big-stars" id="rvAvgStars"></div>
      <div class="rv-big-count" id="rvTotal"></div>
    </div>
    <div class="rv-bars" id="rvBars"></div>
  </div>

  <!-- Filters -->
  <div class="rv-filters" id="rvFilters" style="display:none"></div>

  <!-- Reviews list -->
  <div class="rv-list" id="rvList">
    <div class="rv-loading">Загружаю отзывы…</div>
  </div>

  <!-- CTA -->
  <a class="rv-write-cta" href="https://t.me/Sourdough_Bakery_Bot?start=order"
     target="_blank">
    🍞 Заказать хлеб и оставить отзыв
  </a>
</div>

<script>
(function() {
  'use strict';

  const widget = document.getElementById('reviewsWidget');
  const API_URL = widget.dataset.api || '';
  const LIMIT   = parseInt(widget.dataset.limit || '20', 10);
  const SKU_FILTER = widget.dataset.sku || '';

  const SKU_NAMES = {
    'tartin': 'Тартин',
    'wheat': 'Тартин',
    'zavarnoj': 'Заварной',
    'rye': 'Заварной',
    'syrnyj': 'Сырный',
    'wholegrain': 'Сырный',
    'borodinskij': 'Бородинский',
    'seeds': 'Бородинский',
  };

  // ─── Helpers ───────────────────────────────────────────
  function stars(n) {
    const k = Math.min(5, Math.max(0, Math.round(Number(n) || 0)));
    return '★'.repeat(k) + '☆'.repeat(5 - k);
  }

  function initial(name) {
    return (name || 'П').charAt(0).toUpperCase();
  }

  // ─── Render summary ───────────────────────────────────
  function renderSummary(reviews) {
    if (!reviews.length) return;

    const el = document.getElementById('rvSummary');
    el.style.display = 'flex';

    const total = reviews.length;
    const avg = (reviews.reduce((s, r) => s + r.score, 0) / total).toFixed(1);
    const dist = [0, 0, 0, 0, 0];
    reviews.forEach(r => { if (r.score >= 1 && r.score <= 5) dist[r.score - 1]++; });

    document.getElementById('rvAvg').textContent = avg;
    document.getElementById('rvAvgStars').textContent = stars(Math.round(parseFloat(avg)));
    document.getElementById('rvTotal').textContent = `${total} отзыв${total === 1 ? '' : total < 5 ? 'а' : 'ов'}`;

    const barsEl = document.getElementById('rvBars');
    barsEl.innerHTML = '';
    for (let i = 4; i >= 0; i--) {
      const pct = total ? Math.round(dist[i] / total * 100) : 0;
      barsEl.innerHTML += `
        <div class="rv-bar-row">
          <span class="rv-bar-label">${i + 1}★</span>
          <div class="rv-bar"><div class="rv-bar-fill" style="width:${pct}%"></div></div>
          <span class="rv-bar-cnt">${dist[i]}</span>
        </div>`;
    }
  }

  // ─── Render filters ───────────────────────────────────
  function renderFilters(reviews) {
    const skus = new Set();
    reviews.forEach(r => { if (r.sku) skus.add(r.sku.toLowerCase()); });
    if (skus.size < 2) return; // не показывать фильтр при 1 SKU

    const filtersEl = document.getElementById('rvFilters');
    filtersEl.style.display = 'flex';
    filtersEl.innerHTML = '<button class="rv-filter-btn active" data-sku="">Все</button>';
    skus.forEach(sku => {
      const name = SKU_NAMES[sku] || sku;
      filtersEl.innerHTML += `<button class="rv-filter-btn" data-sku="${sku}">${name}</button>`;
    });

    filtersEl.addEventListener('click', function(e) {
      const btn = e.target.closest('.rv-filter-btn');
      if (!btn) return;
      filtersEl.querySelectorAll('.rv-filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const sku = btn.dataset.sku;
      renderList(sku ? reviews.filter(r => (r.sku || '').toLowerCase() === sku) : reviews);
    });
  }

  // ─── Render list ──────────────────────────────────────
  function renderList(reviews) {
    const listEl = document.getElementById('rvList');

    if (!reviews.length) {
      listEl.innerHTML = '<div class="rv-empty">Пока нет отзывов. Закажите хлеб и будьте первым!</div>';
      return;
    }

    listEl.innerHTML = reviews.map(r => `
      <div class="rv-card">
        <div class="rv-header">
          <div class="rv-avatar">${initial(r.name)}</div>
          <div class="rv-meta">
            <div class="rv-name">${esc(r.name)}</div>
            <div class="rv-date">${esc(r.date)}</div>
          </div>
          <div class="rv-stars">${stars(r.score)}</div>
        </div>
        ${r.text ? `<div class="rv-text">${esc(r.text)}</div>` : ''}
        ${r.sku ? `<span class="rv-sku-tag">${esc(SKU_NAMES[r.sku.toLowerCase()] || r.sku)}</span>` : ''}
        <span class="rv-badge">✓ Проверенная покупка</span>
      </div>
    `).join('');
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // ─── Load ─────────────────────────────────────────────
  async function load() {
    if (!API_URL || API_URL === '__REVIEWS_API_URL__') {
      // Демо-данные, если API не подключен
      const demo = [
        { date: '22 июл 2026', name: 'Анна М.', score: 5, text: 'Лучший хлеб! Корочка хрустит, мякиш пористый и ароматный. Заказываю уже третий раз.', sku: 'tartin', orderId: 'MM-001' },
        { date: '21 июл 2026', name: 'Виктор Л.', score: 5, text: 'Наконец-то бородинский как надо. Не промышленная резина, а настоящий хлеб с кориандром.', sku: 'borodinskij', orderId: 'MM-002' },
        { date: '20 июл 2026', name: 'Игорь В.', score: 5, text: 'Настоящий заварной, как в детстве! Тёмный, плотный, чуть сладковатый от солода.', sku: 'zavarnoj', orderId: 'MM-003' },
        { date: '18 июл 2026', name: 'Наталья Р.', score: 5, text: 'Потрясающий сырный хлеб! Каждый кусок — как сюрприз. Корочка с запечённым сыром — отдельный восторг.', sku: 'syrnyj', orderId: 'MM-004' },
        { date: '17 июл 2026', name: 'Дмитрий К.', score: 5, text: 'Вкус сложный, чуть кислый, как в хороших пекарнях. Замораживал нарезанный — из тостера как свежий.', sku: 'tartin', orderId: 'MM-005' },
        { date: '15 июл 2026', name: 'Елена Т.', score: 4, text: 'Очень вкусный заварной, особенно на второй день — вкус раскрывается. Со шпротами — отдельная история.', sku: 'zavarnoj', orderId: 'MM-006' },
        { date: '12 июл 2026', name: 'Мария С.', score: 4, text: 'Вкусный хлеб, хотелось бы чуть побольше порцию. Качество отличное, закваска чувствуется.', sku: 'tartin', orderId: 'MM-007' },
        { date: '10 июл 2026', name: 'Ольга К.', score: 5, text: 'Муж в восторге — делаем домашний квас из бородинского, невероятно ароматный.', sku: 'borodinskij', orderId: 'MM-008' },
      ];
      renderSummary(demo);
      renderFilters(demo);
      renderList(demo);
      return;
    }

    try {
      const params = new URLSearchParams({ limit: LIMIT });
      if (SKU_FILTER) params.set('sku', SKU_FILTER);

      const resp = await fetch(`${API_URL}?${params}`);
      const reviews = await resp.json();

      if (Array.isArray(reviews) && reviews.length) {
        renderSummary(reviews);
        renderFilters(reviews);
        renderList(reviews);
      } else {
        document.getElementById('rvList').innerHTML =
          '<div class="rv-empty">Пока нет отзывов. Закажите хлеб и будьте первым!</div>';
      }
    } catch (err) {
      console.error('Reviews widget error:', err);
      document.getElementById('rvList').innerHTML =
        '<div class="rv-empty">Не удалось загрузить отзывы</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
