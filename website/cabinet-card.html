<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карточка товара — SeMaVi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f3f0;--card:#fff;--border:#e0ddd8;--text:#1a1a1a;--muted:#7a7a7a;
  --wb:#a332ff;--wb-light:#f0e4ff;--gold:#d4a843;--gold-light:#fdf5e3;
  --green:#2aa05c;--green-light:#e6f7ee;--red:#e74c3c;--red-light:#fdecea;
  --sidebar-bg:#2d1854;--sidebar-text:#e0d6f0
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

/* Topbar */
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
.back-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;text-decoration:none;color:var(--text);flex-shrink:0}
.back-btn:hover{border-color:var(--wb)}
.topbar-title{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-actions{display:flex;gap:8px;flex-shrink:0}
.btn{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--wb)}
.btn-primary{background:var(--wb);color:#fff;border-color:var(--wb)}
.btn-primary:hover{background:#8f1ee0}
.btn-primary:disabled{opacity:.5;cursor:default}

/* Layout */
.wrap{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.panel-title{font-size:14px;font-weight:700}
.panel-hint{font-size:11px;color:var(--muted);margin-left:auto}
.panel-body{padding:18px}

/* Form */
.fgroup{margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:520px){.frow{grid-template-columns:1fr}}
label{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;outline:none;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{border-color:var(--wb)}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.hint{font-size:11px;color:var(--muted);margin-top:4px}

.section-label{font-size:11px;font-weight:800;color:var(--wb);text-transform:uppercase;letter-spacing:1px;margin:22px 0 12px;padding-top:16px;border-top:1px solid var(--border)}
.section-label:first-child{margin-top:0;padding-top:0;border:none}

/* Photos editor */
.photo-list{display:flex;flex-direction:column;gap:8px}
.photo-row{display:flex;gap:8px;align-items:center}
.photo-row input{flex:1}
.photo-prev{width:44px;height:44px;border-radius:8px;border:1px solid var(--border);object-fit:cover;flex-shrink:0;background:var(--bg)}
.icon-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:15px;flex-shrink:0;line-height:1}
.icon-btn:hover{border-color:var(--red);color:var(--red)}
.add-link{margin-top:8px;padding:8px 14px;border-radius:8px;border:1px dashed var(--wb);background:var(--wb-light);color:var(--wb);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}

/* Features editor */
.feat-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.feat-row input{flex:1}

/* ─── Preview (вид карточки покупателя, только просмотр) ─── */
.pv{padding:18px;background:var(--bg)}
.pv-card{background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden}
.pv-gallery{background:#faf8f5;position:relative}
.pv-main{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#faf8f5}
.pv-main-ph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--muted)}
.pv-disc{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:800;padding:4px 9px;border-radius:6px}
.pv-thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.pv-thumb{width:52px;height:52px;border-radius:8px;border:2px solid transparent;object-fit:cover;cursor:pointer;flex-shrink:0;background:var(--bg)}
.pv-thumb.active{border-color:var(--wb)}
.pv-body{padding:16px}
.pv-badge{display:inline-block;background:var(--wb-light);color:var(--wb);font-size:11px;font-weight:700;padding:3px 9px;border-radius:5px;margin-bottom:8px}
.pv-title{font-size:19px;font-weight:800;line-height:1.25;margin-bottom:8px}
.pv-rating{display:flex;align-items:center;gap:7px;font-size:13px;margin-bottom:12px}
.pv-stars{color:var(--gold);letter-spacing:1px}
.pv-rcnt{color:var(--muted);font-size:12px}
.pv-prices{display:flex;align-items:baseline;gap:9px;margin-bottom:4px}
.pv-price{font-size:26px;font-weight:800}
.pv-old{font-size:15px;color:var(--muted);text-decoration:line-through}
.pv-weight{font-size:12px;color:var(--muted);margin-bottom:14px}
.pv-desc{font-size:13px;line-height:1.6;color:#333;margin-bottom:14px}
.pv-feats{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.pv-feat{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:#333}
.pv-chars{border-top:1px solid var(--border);padding-top:12px}
.pv-char{display:flex;justify-content:space-between;gap:14px;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--border)}
.pv-char:last-child{border:none}
.pv-ckey{color:var(--muted);flex-shrink:0}
.pv-cval{text-align:right}
.pv-note{font-size:11px;color:var(--muted);text-align:center;padding:10px;background:var(--gold-light);border-radius:8px;margin-top:12px}

/* States */
.loading,.error{padding:50px 20px;text-align:center;color:var(--muted);font-size:14px}
.error{color:var(--red)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(10px);background:#1a1a1a;color:#fff;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .3s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:none}
.dirty .dirty-dot{display:block}
</style>
</head>
<body>

<div class="topbar">
  <a class="back-btn" href="cabinet-products.html" title="К списку товаров">←</a>
  <div class="topbar-title" id="tbTitle">Карточка товара</div>
  <span class="dirty-dot" id="dirtyDot" title="Есть несохранённые правки"></span>
  <div class="tb-actions">
    <button class="btn" onclick="reload()">↻</button>
    <button class="btn btn-primary" id="saveBtn" onclick="save()">💾 Сохранить</button>
  </div>
</div>

<div id="root">
  <div class="loading">⏳ Загружаю карточку из Google Sheets…</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbygMB0RJZg8tHOm1ueGdNob4ihBssXRwAK4MGwBW3Z4IT5X4qA0Guo1tqcRkWnqoBjj/exec';
const productId = new URLSearchParams(location.search).get('id') || '';

let P = null;          // текущая карточка
let dirty = false;

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
function stars(n){const k=Math.min(5,Math.max(0,Math.round(Number(n)||0)));return '★'.repeat(k)+'☆'.repeat(5-k);}
function money(n){return (Number(n)||0).toLocaleString('ru-RU')+' ₽';}
function toast(m,ok=true){const t=document.getElementById('toast');t.textContent=m;t.style.background=ok?'#1a1a1a':'#e74c3c';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);}
function markDirty(){dirty=true;document.body.classList.add('dirty');}

/* ─── Загрузка ─── */
async function reload(){
  document.getElementById('root').innerHTML='<div class="loading">⏳ Загружаю…</div>';
  if(!productId){
    document.getElementById('root').innerHTML='<div class="error">Не указан товар. Откройте карточку из списка <a href="cabinet-products.html">Товары</a>.</div>';
    return;
  }
  try{
    const r=await fetch(API+'?action=products&id='+encodeURIComponent(productId));
    const data=await r.json();
    let p=Array.isArray(data)?data.find(x=>String(x.id).trim()===productId.trim()):(data&&data.id?data:null);
    if(!p){document.getElementById('root').innerHTML='<div class="error">Товар «'+esc(productId)+'» не найден в листе «Товары».</div>';return;}
    P={
      id:p.id, name:p.name||'', emoji:p.emoji||'🍞',
      weight:p.weight||0, price:p.price||0, oldPrice:p.oldPrice||0,
      desc:p.desc||p.description||'',
      photos:(p.photos&&p.photos.length?p.photos:(p.photo?[p.photo]:[])).filter(Boolean),
      rating:p.rating||0, reviews:p.reviews||0, badge:p.badge||'',
      composition:p.composition||'', fermentation:p.fermentation||'',
      shelfLife:p.shelfLife||'', calories:p.calories||'', allergens:p.allergens||'',
      features:(p.features||[]).filter(Boolean),
      status:p.status||'active'
    };
    dirty=false;document.body.classList.remove('dirty');
    document.getElementById('tbTitle').textContent=P.emoji+' '+P.name;
    render();
  }catch(e){
    document.getElementById('root').innerHTML='<div class="error">Ошибка загрузки: '+esc(e.message)+'</div>';
  }
}

/* ─── Отрисовка ─── */
function render(){
  document.getElementById('root').innerHTML=
    '<div class="wrap">'
    + '<div class="panel"><div class="panel-head"><span class="panel-title">✏️ Редактирование</span>'
    +   '<span class="panel-hint">Google Sheets · лист «Товары»</span></div>'
    +   '<div class="panel-body" id="form"></div></div>'
    + '<div class="panel"><div class="panel-head"><span class="panel-title">👁 Предпросмотр</span>'
    +   '<span class="panel-hint">так увидит покупатель</span></div>'
    +   '<div class="pv" id="preview"></div></div>'
    + '</div>';
  renderForm();
  renderPreview();
}

function field(key,label,type='text',hint=''){
  const v=P[key]==null?'':P[key];
  const el = type==='textarea'
    ? '<textarea id="f_'+key+'" oninput="onField(\''+key+'\',this.value)">'+esc(v)+'</textarea>'
    : '<input id="f_'+key+'" type="'+type+'" value="'+esc(v)+'" oninput="onField(\''+key+'\',this.value)"/>';
  return '<div class="fgroup"><label>'+label+'</label>'+el+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';
}

function renderForm(){
  document.getElementById('form').innerHTML =
    '<div class="section-label">Основное</div>'
    + '<div class="frow">'
    +   '<div><label>Название</label><input id="f_name" value="'+esc(P.name)+'" oninput="onField(\'name\',this.value)"/></div>'
    +   '<div><label>Эмодзи</label><input id="f_emoji" value="'+esc(P.emoji)+'" oninput="onField(\'emoji\',this.value)"/></div>'
    + '</div>'
    + '<div class="frow">'
    +   '<div><label>Цена, ₽</label><input id="f_price" type="number" value="'+esc(P.price)+'" oninput="onField(\'price\',this.value)"/></div>'
    +   '<div><label>Старая цена, ₽</label><input id="f_oldPrice" type="number" value="'+esc(P.oldPrice)+'" oninput="onField(\'oldPrice\',this.value)"/></div>'
    + '</div>'
    + '<div class="frow">'
    +   '<div><label>Вес, г</label><input id="f_weight" type="number" value="'+esc(P.weight)+'" oninput="onField(\'weight\',this.value)"/></div>'
    +   '<div><label>Статус</label><select id="f_status" onchange="onField(\'status\',this.value)">'
    +     '<option value="active"'+(P.status==='active'?' selected':'')+'>Активен</option>'
    +     '<option value="hidden"'+(P.status==='hidden'?' selected':'')+'>Скрыт</option>'
    +     '<option value="out"'+(P.status==='out'?' selected':'')+'>Нет в наличии</option>'
    +   '</select></div>'
    + '</div>'
    + field('badge','Плашка','text','Например: 🏆 Выбор покупателей')
    + field('desc','Описание','textarea')

    + '<div class="section-label">Фотографии</div>'
    + '<div id="photos"></div>'

    + '<div class="section-label">Характеристики</div>'
    + field('composition','Состав','textarea')
    + '<div class="frow">'
    +   '<div><label>Ферментация</label><input id="f_fermentation" value="'+esc(P.fermentation)+'" oninput="onField(\'fermentation\',this.value)"/></div>'
    +   '<div><label>Срок годности</label><input id="f_shelfLife" value="'+esc(P.shelfLife)+'" oninput="onField(\'shelfLife\',this.value)"/></div>'
    + '</div>'
    + field('calories','КБЖУ','text','250 ккал / 100 г | Б: 8 г | Ж: 1.2 г | У: 48 г')
    + field('allergens','Аллергены','text')

    + '<div class="section-label">Преимущества</div>'
    + '<div id="feats"></div>'

    + '<div class="section-label">Отзывы</div>'
    + '<div class="frow">'
    +   '<div><label>Рейтинг (0–5)</label><input id="f_rating" type="number" step="0.1" min="0" max="5" value="'+esc(P.rating)+'" oninput="onField(\'rating\',this.value)"/></div>'
    +   '<div><label>Кол-во отзывов</label><input id="f_reviews" type="number" min="0" value="'+esc(P.reviews)+'" oninput="onField(\'reviews\',this.value)"/></div>'
    + '</div>';
  renderPhotos();
  renderFeats();
}

function renderPhotos(){
  const rows = P.photos.map((url,i)=>
    '<div class="photo-row">'
    + '<img class="photo-prev" src="'+esc(url)+'" onerror="this.style.opacity=.25"/>'
    + '<input value="'+esc(url)+'" placeholder="https://…" oninput="setPhoto('+i+',this.value)"/>'
    + '<button class="icon-btn" onclick="delPhoto('+i+')" title="Удалить">×</button>'
    + '</div>').join('');
  document.getElementById('photos').innerHTML =
    '<div class="photo-list">'+(rows||'<div class="hint">Фотографий пока нет</div>')+'</div>'
    + '<button class="add-link" onclick="addPhoto()">+ Добавить фото</button>'
    + '<div class="hint">Первое фото — главное. Ссылки на файлы в GitHub репозитории assets/.</div>';
}

function renderFeats(){
  const rows = P.features.map((f,i)=>
    '<div class="feat-row">'
    + '<input value="'+esc(f)+'" placeholder="Например: Ручная формовка" oninput="setFeat('+i+',this.value)"/>'
    + '<button class="icon-btn" onclick="delFeat('+i+')" title="Удалить">×</button>'
    + '</div>').join('');
  document.getElementById('feats').innerHTML =
    (rows||'<div class="hint">Пунктов пока нет</div>')
    + '<button class="add-link" onclick="addFeat()">+ Добавить пункт</button>';
}

/* ─── Правки ─── */
function onField(k,v){
  P[k] = ['price','oldPrice','weight','reviews'].includes(k) ? (parseInt(v)||0)
       : k==='rating' ? Math.min(5,Math.max(0,parseFloat(v)||0))
       : v;
  markDirty();
  if(k==='name'||k==='emoji') document.getElementById('tbTitle').textContent=P.emoji+' '+P.name;
  renderPreview();
}
function setPhoto(i,v){P.photos[i]=v;markDirty();renderPreview();}
function addPhoto(){P.photos.push('');markDirty();renderPhotos();renderPreview();}
function delPhoto(i){P.photos.splice(i,1);markDirty();renderPhotos();renderPreview();}
function setFeat(i,v){P.features[i]=v;markDirty();renderPreview();}
function addFeat(){P.features.push('');markDirty();renderFeats();renderPreview();}
function delFeat(i){P.features.splice(i,1);markDirty();renderFeats();renderPreview();}

/* ─── Предпросмотр ─── */
let mainIdx = 0;
function pickPhoto(i){mainIdx=i;renderPreview();}

function renderPreview(){
  const photos=P.photos.filter(Boolean);
  if(mainIdx>=photos.length) mainIdx=0;
  const disc = P.oldPrice>P.price&&P.oldPrice ? Math.round((1-P.price/P.oldPrice)*100) : 0;

  const chars=[['Вес',P.weight?P.weight+' г':''],['Состав',P.composition],
    ['Ферментация',P.fermentation],['Срок годности',P.shelfLife],
    ['КБЖУ',P.calories],['Аллергены',P.allergens]]
    .filter(([,v])=>v)
    .map(([k,v])=>'<div class="pv-char"><span class="pv-ckey">'+esc(k)+'</span><span class="pv-cval">'+esc(v)+'</span></div>').join('');

  const feats=P.features.filter(Boolean)
    .map(f=>'<div class="pv-feat"><span>✓</span><span>'+esc(f)+'</span></div>').join('');

  document.getElementById('preview').innerHTML =
    '<div class="pv-card">'
    + '<div class="pv-gallery">'
    +   (disc?'<span class="pv-disc">−'+disc+'%</span>':'')
    +   (photos.length
        ? '<img class="pv-main" src="'+esc(photos[mainIdx])+'" onerror="this.style.opacity=.2"/>'
        : '<div class="pv-main-ph">'+esc(P.emoji)+'</div>')
    +   (photos.length>1
        ? '<div class="pv-thumbs">'+photos.map((u,i)=>'<img class="pv-thumb'+(i===mainIdx?' active':'')+'" src="'+esc(u)+'" onclick="pickPhoto('+i+')" onerror="this.style.opacity=.2"/>').join('')+'</div>'
        : '')
    + '</div>'
    + '<div class="pv-body">'
    +   (P.badge?'<div class="pv-badge">'+esc(P.badge)+'</div>':'')
    +   '<div class="pv-title">'+esc(P.name||'Без названия')+'</div>'
    +   '<div class="pv-rating"><span class="pv-stars">'+stars(P.rating)+'</span>'
    +     '<span>'+(Number(P.rating)||0)+'</span><span class="pv-rcnt">· '+(P.reviews||0)+' отзывов</span></div>'
    +   '<div class="pv-prices"><span class="pv-price">'+money(P.price)+'</span>'
    +     (P.oldPrice>P.price?'<span class="pv-old">'+money(P.oldPrice)+'</span>':'')+'</div>'
    +   '<div class="pv-weight">'+(P.weight?P.weight+' г':'')+'</div>'
    +   (P.desc?'<div class="pv-desc">'+esc(P.desc)+'</div>':'')
    +   (feats?'<div class="pv-feats">'+feats+'</div>':'')
    +   (chars?'<div class="pv-chars">'+chars+'</div>':'')
    + '</div></div>'
    + '<div class="pv-note">Витрина администратора — кнопок покупки здесь нет</div>';
}

/* ─── Сохранение ─── */
async function save(){
  if(!P) return;
  const btn=document.getElementById('saveBtn');
  btn.disabled=true;btn.textContent='Сохраняю…';
  try{
    const payload={_type:'product',
      id:P.id,name:P.name,emoji:P.emoji,weight:P.weight,price:P.price,oldPrice:P.oldPrice,
      desc:P.desc,photo:(P.photos.filter(Boolean)[0]||''),photos:P.photos.filter(Boolean),
      rating:P.rating,reviews:P.reviews,badge:P.badge,composition:P.composition,
      fermentation:P.fermentation,shelfLife:P.shelfLife,calories:P.calories,
      allergens:P.allergens,features:P.features.filter(Boolean),status:P.status};
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify(payload)});
    const res=await r.json().catch(()=>({status:'ok'}));
    if(res.status==='error') throw new Error(res.message||'Ошибка сохранения');
    dirty=false;document.body.classList.remove('dirty');
    toast('✅ Карточка сохранена в Google Sheets');
  }catch(e){
    toast('❌ '+e.message,false);
  }finally{
    btn.disabled=false;btn.textContent='💾 Сохранить';
  }
}

window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});
reload();
</script>
</body>
</html>
